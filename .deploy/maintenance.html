<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Perbaikan — Megakomsel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .card { max-width: 480px; }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 28px; margin-bottom: 12px; font-weight: 700; }
  p { font-size: 16px; line-height: 1.6; color: #cbd5e1; margin-bottom: 24px; }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 13px;
    color: #93c5fd;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>Website Sedang Dalam Perbaikan</h1>
    <p>
      Mohon maaf, website Megakomsel sedang dalam perbaikan / maintenance.
      Silakan kembali beberapa saat lagi. Terima kasih atas pengertiannya.
    </p>
    <span class="badge">CV Megakomsel IMATECH</span>
  </div>
</body>
</html>
